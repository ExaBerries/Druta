[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "druta"
version = "1.3.0"
requires-python = ">=3.10"
dependencies = ["dearpygui==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120
indent-width = 4
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "T20"]
ignore = ["E501", "N802", "B008", "T201"]
exclude = [".git", "__pycache__", "build", "dist", "*.egg-info", ".venv", "venv", "experiments"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.isort]
known-first-party = ["druta"]

[tool.pyright]
include = ["src"]
exclude = ["**/experiments/**", "**/tests/**", "**/build/**", "**/dist/**"]
reportMissingImports = "warning"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
typeCheckingMode = "basic"
pythonVersion = "3.10"
pythonPlatform = "Windows"
venvPath = "."
venv = ".venv"
stubPath = "typings"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/druta"]
omit = ["tests/*", "src/druta/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
